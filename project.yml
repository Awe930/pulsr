name: Pulsr
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
targets:
  Pulsr:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    # Watch app unhooked for now (stage 1): the iPhone app builds alone. Re-add in stage 4.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).nine30
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nine30
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Nine30 reads heart rate, HRV, sleep, respiratory rate, workouts and steps recorded by your Apple Watch to calculate your Recovery, Strain and Sleep scores. Everything stays on your device.
        NSHealthUpdateUsageDescription: Nine30 does not write any data to Apple Health.
    entitlements:
      path: iOS/Resources/Pulsr.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
  PulsrWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).nine30.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).nine30
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Nine30
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).nine30
        NSHealthShareUsageDescription: Nine30 reads heart rate, HRV and sleep from this watch to show your Recovery, Strain and Sleep scores.
        NSHealthUpdateUsageDescription: Nine30 does not write any data to Apple Health.
    entitlements:
      path: Watch/PulsrWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
schemes:
  Pulsr:
    build:
      targets:
        Pulsr: all
    run:
      config: Debug
